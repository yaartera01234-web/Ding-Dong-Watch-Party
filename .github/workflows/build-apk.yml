name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null

      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-37.2" "build-tools;37.0.0" "ndk;29.0.14206865"

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Rename APK
        run: |
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk "DingDong-Android-v${{ github.run_number }}.apk"
          ls -la *.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DingDong-APK
          path: DingDong-Android-v${{ github.run_number }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Ding Dong APK (build ${{ github.run_number }})
          files: DingDong-Android-v${{ github.run_number }}.apk
          draft: false
          prerelease: false
          
